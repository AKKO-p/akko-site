<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-label="AKKO AI Runtime architecture, six components in a hexagonal grid">
  <title>AKKO AI Runtime architecture</title>
  <desc>Six components of the AKKO AI Runtime arranged in a hexagonal grid: Query Engine + AI Functions, NL2SQL Orchestrator, Catalog Auto-Enrichment, AI Governance Engine, AI Observability Layer, and RAG Pipeline.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="hex1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="hex2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="hex3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="hex4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="hex5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="hex6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(108,99,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="540" fill="url(#bg)"/>
  <rect width="1080" height="540" fill="url(#grid)"/>

  <!-- Title strip -->
  <text x="540" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" letter-spacing="3" fill="#a1a1aa" font-weight="600">AKKO  AI  RUNTIME  —  6  COMPONENTS</text>

  <!-- ============================================================
       Hex layout — 3 columns x 2 rows, pointy-top hexagons
       hex width  = 220, hex height = 200
       column centers: 230, 540, 850
       row centers:    220, 400
       hex side length s ≈ 115
       ============================================================ -->

  <!-- Connector lines (drawn before hexes so they sit underneath) -->
  <g stroke="rgba(255,255,255,0.10)" stroke-width="1.4" fill="none" stroke-dasharray="4 5">
    <!-- top row horizontals -->
    <line x1="345" y1="220" x2="425" y2="220"/>
    <line x1="655" y1="220" x2="735" y2="220"/>
    <!-- bottom row horizontals -->
    <line x1="345" y1="400" x2="425" y2="400"/>
    <line x1="655" y1="400" x2="735" y2="400"/>
    <!-- vertical drops -->
    <line x1="230" y1="305" x2="230" y2="320"/>
    <line x1="540" y1="305" x2="540" y2="320"/>
    <line x1="850" y1="305" x2="850" y2="320"/>
  </g>

  <!-- ============================================================
       HEX 1 — Query Engine + AI Functions  (top-left)
       ============================================================ -->
  <g filter="url(#softglow)">
    <polygon points="230,130 320,180 320,260 230,310 140,260 140,180"
             fill="url(#hex1)" stroke="#6c63ff" stroke-width="1.5"/>
  </g>
  <text x="230" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="2">01 · QUERY</text>
  <text x="230" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">Query Engine</text>
  <text x="230" y="244" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">+ AI Functions</text>
  <text x="230" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b7dff">17 akko_ai_* SQL</text>

  <!-- ============================================================
       HEX 2 — NL2SQL Orchestrator  (top-center)
       ============================================================ -->
  <g filter="url(#softglow)">
    <polygon points="540,130 630,180 630,260 540,310 450,260 450,180"
             fill="url(#hex2)" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <text x="540" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="2">02 · AI</text>
  <text x="540" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">NL2SQL</text>
  <text x="540" y="244" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">Orchestrator</text>
  <text x="540" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#b8a5ff">scope-first OPA</text>

  <!-- ============================================================
       HEX 3 — Catalog Auto-Enrichment  (top-right)
       ============================================================ -->
  <g filter="url(#softglow)">
    <polygon points="850,130 940,180 940,260 850,310 760,260 760,180"
             fill="url(#hex3)" stroke="#0ea5e9" stroke-width="1.5"/>
  </g>
  <text x="850" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="2">03 · CATALOG</text>
  <text x="850" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">Catalog Auto-</text>
  <text x="850" y="244" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">Enrichment</text>
  <text x="850" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7dd3fc">PII · FK · log mining</text>

  <!-- ============================================================
       HEX 4 — AI Governance Engine  (bottom-left)
       ============================================================ -->
  <g filter="url(#softglow)">
    <polygon points="230,310 320,360 320,440 230,490 140,440 140,360"
             fill="url(#hex4)" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  <text x="230" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="2">04 · GOVERNANCE</text>
  <text x="230" y="405" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">AI Governance</text>
  <text x="230" y="424" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">Engine</text>
  <text x="230" y="450" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86efac">OCSF · OPA · PII graph</text>

  <!-- ============================================================
       HEX 5 — AI Observability Layer  (bottom-center)
       ============================================================ -->
  <g filter="url(#softglow)">
    <polygon points="540,310 630,360 630,440 540,490 450,440 450,360"
             fill="url(#hex5)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="540" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="2">05 · OBSERVABILITY</text>
  <text x="540" y="405" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">AI Observability</text>
  <text x="540" y="424" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">Layer</text>
  <text x="540" y="450" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fcd34d">cost · cache · drift</text>

  <!-- ============================================================
       HEX 6 — RAG Pipeline  (bottom-right)
       ============================================================ -->
  <g filter="url(#softglow)">
    <polygon points="850,310 940,360 940,440 850,490 760,440 760,360"
             fill="url(#hex6)" stroke="#ec4899" stroke-width="1.5"/>
  </g>
  <text x="850" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="2">06 · RAG</text>
  <text x="850" y="405" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">RAG Pipeline</text>
  <text x="850" y="424" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafafa">3-tier</text>
  <text x="850" y="450" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f9a8d4">pgvector · OS · Iceberg</text>

  <!-- Foundation rail -->
  <g>
    <rect x="60" y="510" width="960" height="22" rx="11" fill="#111113" stroke="rgba(255,255,255,0.08)"/>
    <text x="540" y="525" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" fill="#71717a" font-weight="600">OPEN-SOURCE LEGO FOUNDATION  ·  HELM  ·  KUBERNETES  ·  ZERO OUTBOUND</text>
  </g>
</svg>
