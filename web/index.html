<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a12" />
    <script>
      // set the theme before first paint to avoid a flash
      (function () {
        try {
          var k = 'akko-theme', s = localStorage.getItem(k);
          var t = s === 'dark' || s === 'light'
            ? s
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>AKKO, la plateforme data &amp; IA souveraine</title>
    <meta
      name="description"
      content="AKKO est une plateforme data et IA souveraine, auto-hébergée sur votre infrastructure Kubernetes. Un moteur de fédération unique, un lakehouse ouvert, une IA gouvernée. Vos données, vos modèles et vos clés ne quittent jamais votre infrastructure."
    />
    <link rel="canonical" href="https://akko-ai.com/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AKKO" />
    <meta property="og:title" content="AKKO, la plateforme data &amp; IA souveraine" />
    <meta
      property="og:description"
      content="Un moteur de fédération unique, un lakehouse ouvert, une IA gouvernée. Auto-hébergée sur votre infrastructure : vos données ne la quittent jamais."
    />
    <meta property="og:url" content="https://akko-ai.com/" />
    <meta property="og:image" content="https://akko-ai.com/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="Un moteur de fédération unique, un lakehouse ouvert, une IA gouvernée. Auto-hébergée sur votre infrastructure."
    />
    <meta name="twitter:image" content="https://akko-ai.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
