<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14171c" />
    <!-- Sovereign by construction: a strict CSP that admits no third-party host.
         Fonts, CSS, JS, images are all self-hosted or inline. The site is
         air-gap in its delivery, an echo of the air-gap product. Inspect the
         Network tab: nothing leaves. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <script>
      // set the theme before first paint to avoid a flash
      (function () {
        try {
          var k = 'akko-theme', s = localStorage.getItem(k);
          var t = s === 'dark' || s === 'light'
            ? s
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>AKKO — Votre donnée ne sort jamais, même quand l'IA la lit</title>
    <meta
      name="description"
      content="AKKO est la plateforme data et IA que vous hébergez sur votre propre cluster Kubernetes. Chaque accès, humain ou agent, franchit une porte de gouvernance. Rien ne s'échappe, et vous pouvez le vérifier vous-même."
    />
    <link rel="canonical" href="https://akko-ai.com/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AKKO" />
    <meta property="og:title" content="AKKO, la plateforme data &amp; IA souveraine" />
    <meta
      property="og:description"
      content="Un moteur de fédération unique, un lakehouse ouvert, une IA gouvernée. Auto-hébergée sur votre infrastructure : vos données ne la quittent jamais."
    />
    <meta property="og:url" content="https://akko-ai.com/" />
    <meta property="og:image" content="https://akko-ai.com/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AKKO, la plateforme data &amp; IA souveraine" />
    <meta
      name="twitter:description"
      content="Un moteur de fédération unique, un lakehouse ouvert, une IA gouvernée. Auto-hébergée sur votre infrastructure."
    />
    <meta name="twitter:image" content="https://akko-ai.com/og-image.png" />
    <!-- No external font host. Typography is self-hosted (see src/main.tsx). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
